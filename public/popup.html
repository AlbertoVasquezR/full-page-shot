<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Full Page Shot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <img class="head__icon" src="icons/icon32.png" alt="" width="30" height="30" />
        <div class="head__text">
          <h1>Full Page Shot</h1>
          <p>Capture the whole page, not just what you see.</p>
        </div>
      </header>

      <button id="capture" class="primary" type="button">
        <span id="captureLabel">Capture full page</span>
      </button>

      <div class="feedback">
        <section id="progress" class="progress" hidden>
          <div class="bar"><div id="progressFill" class="bar__fill"></div></div>
          <p id="statusText" class="status"></p>
        </section>

        <section id="result" class="card" hidden>
          <p id="resultTitle" class="card__title"></p>
          <p id="resultMeta" class="card__meta"></p>
          <div class="row">
            <button id="showFile" class="ghost" type="button">Show file</button>
            <button id="captureAgain" class="ghost" type="button">Capture again</button>
          </div>
        </section>

        <section id="errorBox" class="alert" hidden>
          <p id="errorTitle" class="alert__title"></p>
          <p id="errorHint" class="alert__hint"></p>
        </section>
      </div>

      <section id="recentSection" class="recent" hidden>
        <p class="recent__title">Recent captures</p>
        <ul id="recentList" class="recent__list"></ul>
      </section>

      <section class="settings">
        <div class="field">
          <span class="field__label">Format</span>
          <div id="formatGroup" class="segmented" role="group" aria-label="Image format">
            <button type="button" class="seg" data-format="png">PNG</button>
            <button type="button" class="seg" data-format="jpeg">JPEG</button>
          </div>
        </div>

        <div id="qualityField" class="field" hidden>
          <label class="field__label" for="quality">JPEG quality · <output id="qualityValue">92</output></label>
          <input id="quality" class="range" type="range" min="40" max="100" step="1" value="92" />
        </div>

        <label class="check">
          <input id="copyToggle" type="checkbox" />
          <span>Copy to clipboard</span>
        </label>

        <div class="field">
          <span class="field__label">Page walk</span>
          <div id="modeGroup" class="segmented" role="group" aria-label="Capture mode">
            <button type="button" class="seg" data-mode="auto">Automatic</button>
            <button type="button" class="seg" data-mode="fast">Fast</button>
            <button type="button" class="seg" data-mode="scroll">Scroll</button>
            <button type="button" class="seg" data-mode="visible">Visible</button>
          </div>
          <span class="field__hint">Automatic decides on its own. Fast: single pass. Scroll: walks the view step by step.</span>
        </div>
      </section>

      <footer class="foot">
        <button id="openOptions" class="link" type="button">Save options</button>
        <span id="destHint" class="foot__hint"></span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
