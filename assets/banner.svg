<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Full Page Shot">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#dots)"/>
  <rect width="900" height="100" fill="url(#shine)"/>

  <!-- Decorative screenshot frame -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="8" y="8" width="104" height="12" rx="3" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="8" y="26" width="104" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="8" y="38" width="80" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="8" y="50" width="95" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="8" y="62" width="60" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <!-- scroll indicator -->
    <rect x="112" y="8" width="4" height="74" rx="2" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="112" y="8" width="4" height="24" rx="2" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="210" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Full Page Shot</text>
  <text x="210" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.85">Capture the whole page, no matter how long · Microsoft Edge · Manifest V3</text>

  <!-- Badge-like pills -->
  <g transform="translate(210, 150)">
    <rect x="0" y="0" width="92" height="26" rx="13" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="46" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">TypeScript</text>
    <rect x="100" y="0" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="139" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">esbuild</text>
    <rect x="186" y="0" width="62" height="26" rx="13" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="217" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">MIT</text>
  </g>
</svg>